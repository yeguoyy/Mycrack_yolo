
nc: 1 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n-obb.yaml' will call yolo26-obb.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 291 layers, 2,715,614 parameters, 2,715,614 gradients, 16.9 GFLOPs

# YOLO26n backbone
backbone:
  # 第0层一次输出列表：[P3, P4, P5]
  - [-1, 1, DINOv2Pyramid, []]             # 0

  # 从第0层的输出列表中分别取出三张特征图
  - [0, 1, Index, [128, 0]]               # 1：P3
  - [0, 1, Index, [128, 1]]               # 2：P4
  - [0, 1, Index, [256, 2]]               # 3：P5

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 6

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 9 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 6], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 12 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 3], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 15 (P5/32-large)

  - [[9, 12, 15], 1, OBB26, [nc, 1]] # OBB26(P3, P4, P5)
